<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 | 뷰티풀 에듀</title>
  <link rel="stylesheet" href="style.css?v=reader-guide-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body class="subpage admin-page">
  <header class="auth-header">
    <div class="wrap admin-header">
      <a class="brand masthead-brand" href="index.html" aria-label="뷰티풀 에듀 홈으로 이동"><strong>뷰티풀 에듀</strong><span class="brand-english">(View-tiful Edu)</span></a>
      <nav class="account-actions" aria-label="계정 메뉴">
        <a id="account-user" class="login-link" href="login.html">로그인</a>
        <a id="account-role" class="login-link" hidden></a>
        <a id="account-action" class="signup-link" href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>
  <main class="wrap admin-main">
    <a class="back-home" href="index.html">← 메인으로 돌아가기</a>
    <div class="listing-heading">
      <p class="category">View-tiful Edu</p>
      <h1>관리자 페이지</h1>
      <p>기자 신청을 확인하고 승인하거나 거절합니다.</p>
    </div>
    <p id="admin-status" class="admin-status" role="status" aria-live="polite">관리자 권한을 확인하고 있습니다.</p>
    <section id="admin-content" class="admin-panel" aria-labelledby="pending-title" hidden>
      <h2 id="pending-title">기자 승인 대기</h2>
      <div id="pending-reporters" class="admin-list"></div>
    </section>
  </main>
</body>
</html>
